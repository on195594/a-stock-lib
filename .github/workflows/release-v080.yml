name: Finalize v0.8.0

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    if: "github.event.head_commit.message == 'docs(release): Finalize v0.8.0'"
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.8.0 \
            --repo "$GITHUB_REPOSITORY" \
            --notes "Remove the retired report-regex contract and clarify shared deterministic domain ownership. Wheel SHA-256: a811945b23d97eb121ff82d54bc0ba0810000a5379a9e9786fdcdc9220b30310."
