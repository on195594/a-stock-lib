[project]
name = "a-stock-lib"
version = "0.10.0"
description = "Shared deterministic A-share domain contracts, framework scoring, valuation, and market-data provider primitives for a-stock consumers"
requires-python = ">=3.13"
dependencies = [
    "pandas",
]

[project.optional-dependencies]
tushare = ["tushare==1.4.29"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["a_stock_lib*"]

[tool.setuptools.package-data]
a_stock_lib = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
