[project]
name = "a-stock-lib"
version = "0.5.0"
description = "Shared market-data provider primitives for a-stock-tracker and a-stock-agent-skills"
requires-python = ">=3.11"
dependencies = [
    "pandas",
]

[project.optional-dependencies]
tushare = ["tushare==1.4.29"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["a_stock_lib*"]
